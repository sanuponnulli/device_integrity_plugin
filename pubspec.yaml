name: device_integrity
description: >
  A reusable device-integrity plugin that reports separate, explainable
  integrity signals and supports platform-backed attestation for server
  verification. Signals are distinct — root/jailbreak, emulator, debugger,
  hooking, proxy, and app-tampering are never collapsed into one verdict.
version: 0.1.0
homepage: https://github.com/example/device_integrity

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.device_integrity
        pluginClass: DeviceIntegrityPlugin
      ios:
        pluginClass: DeviceIntegrityPlugin
