name: Flutter Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dart:
    name: Dart checks (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest version allowed by pubspec.yaml (`flutter: ">=3.44.0"`).
          - label: "3.44.0 minimum"
            flutter_version: "3.44.0"
          # An empty version means the latest release on the stable channel.
          - label: "latest stable"
            flutter_version: ""
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze plugin
        run: flutter analyze --fatal-infos

      - name: Run plugin tests
        run: flutter test

  build_android:
    name: Android example (${{ matrix.kotlin }} Kotlin)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # builtin: AGP Built-in Kotlin + new DSL (the example's checked-in setup).
        # legacy: Kotlin Gradle Plugin + old DSL, which most apps still use.
        kotlin: [builtin, legacy]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Switch example to legacy Kotlin Gradle Plugin mode
        if: matrix.kotlin == 'legacy'
        run: |
          sed -i 's/^android.builtInKotlin=.*/android.builtInKotlin=false/; s/^android.newDsl=.*/android.newDsl=false/' example/android/gradle.properties
          grep -E 'builtInKotlin|newDsl' example/android/gradle.properties

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Run example widget tests
        if: matrix.kotlin == 'builtin'
        working-directory: example
        run: flutter test

      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

      - name: Build example release APK
        if: matrix.kotlin == 'builtin'
        working-directory: example
        run: flutter build apk --release

      - name: Run Android lint on the plugin
        if: matrix.kotlin == 'builtin'
        working-directory: example/android
        run: ./gradlew :device_integrity_plugin:lintDebug --console=plain

      - name: Upload Android lint report
        if: failure() && matrix.kotlin == 'builtin'
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: example/build/device_integrity_plugin/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Check native libraries for 16 KB page-size support
        if: matrix.kotlin == 'builtin'
        shell: bash
        run: |
          set -euo pipefail
          apk="example/build/app/outputs/flutter-apk/app-debug.apk"
          mkdir -p output_apk
          unzip -o "$apk" -d output_apk >/dev/null

          found=false
          failed=false
          while IFS= read -r -d '' so; do
            found=true
            while IFS= read -r alignment; do
              [[ -z "$alignment" ]] && continue
              value=$((alignment))
              if (( value < 16384 )); then
                echo "[FAIL] $so has a LOAD segment aligned to $alignment (requires at least 0x4000)"
                failed=true
              fi
            done < <(readelf -Wl "$so" | awk '$1 == "LOAD" { print $NF }')
          done < <(find output_apk -type f -name '*.so' -print0)

          if [[ "$found" == false ]]; then
            echo "No native shared libraries found in the APK; 16 KB ELF alignment check skipped."
          fi
          if [[ "$failed" == true ]]; then
            exit 1
          fi
          if [[ "$found" == true ]]; then
            echo "All native shared libraries have LOAD alignment of at least 16 KB."
          fi

          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          if [[ -z "$zipalign" ]]; then
            echo "Could not find Android zipalign in $ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          "$zipalign" -c -P 16 4 "$apk"

  build_ios:
    name: iOS example (${{ matrix.dependency_manager }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin ships both a Package.swift and a podspec.
        dependency_manager: [spm, cocoapods]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use CocoaPods instead of Swift Package Manager
        if: matrix.dependency_manager == 'cocoapods'
        run: flutter config --no-enable-swift-package-manager

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example for iOS
        working-directory: example
        run: flutter build ios --no-codesign

      - name: Validate podspec
        if: matrix.dependency_manager == 'cocoapods'
        run: >
          pod lib lint ios/device_integrity_plugin.podspec
          --configuration=Debug --skip-tests --use-modular-headers
          --allow-warnings --quick

  package_validation:
    name: Package and documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate API documentation
        run: dart doc --output /tmp/device-integrity-docs

      - name: Validate pub package archive
        run: flutter pub publish --dry-run
