org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The example uses AGP 9's Built-in Kotlin and new DSL to prove the plugin no
# longer depends on the Kotlin Gradle Plugin. CI also builds the legacy mode
# (both flags false), which most apps still use.
android.newDsl=true
android.builtInKotlin=true
